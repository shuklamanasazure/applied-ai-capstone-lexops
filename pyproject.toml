[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-ai-capstone-starter"
version = "0.1.0"
description = "Empty educational scaffold for IIT Hyderabad Applied AI capstones"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Add and pin the dependencies you actually use as milestones progress.
# Evaluation/scripts remain repository-level tooling, outside this package.
